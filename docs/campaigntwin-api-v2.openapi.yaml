    HistoricalCase:
      type: object
      additionalProperties: false
      required: [campaign_id, dataset, evidence_version, source, category, matched_on, limitations,
        fit_through_week, baseline_weeks, campaign_weeks, metric, unit, observed_range]
      properties:
        campaign_id: {type: string, minLength: 1}
        dataset: {const: complete_journey}
        evidence_version: {type: string, description: SHA-256 of the canonical loader-returned case JSON, pattern: '^[0-9a-f]{64}$'}
        source: {const: data}
        category: {const: toilet_tissue}
        matched_on: {type: array, minItems: 1, uniqueItems: true, items: {enum: [category, offer_mechanic]}}
        limitations: {type: array, minItems: 1, items: {type: string, minLength: 1}}
        fit_through_week: {type: integer, minimum: 1}
        baseline_weeks: {$ref: '#/components/schemas/WeekWindow'}
        campaign_weeks: {$ref: '#/components/schemas/WeekWindow'}
        metric: {const: control_adjusted_category_sales_lift}
        unit: {const: percentage_points}
        observed_range:
          type: object
          additionalProperties: false
          required: [low, high, basis]
          properties:
            low: {type: number}
            high: {type: number}
            basis: {const: mean_and_median_control_adjustment}
    WeekWindow:
      type: object
      additionalProperties: false
      required: [first, last]
      description: Inclusive retail week indices from the historical dataset.
      properties:
        first: {type: integer, minimum: 1}
        last: {type: integer, minimum: 1}
    HistoricalPrediction:
      description: |
        Optional future engine-to-adapter evidence. The producer must rehearse the named historical
        campaign and calculate the same control-adjusted category-sales measure. Protocol v1 binds
        the metric, aggregate population, baseline and control definitions used by load_backtest.
        artifact_id identifies an immutable prediction with an auditable fit cutoff.
      type: object
      additionalProperties: false
      required: [artifact_id, campaign_id, evidence_version, protocol, fit_through_week, baseline_weeks,
        campaign_weeks, metric, unit, value]
      properties:
        artifact_id: {type: string, minLength: 1}
        campaign_id: {type: string, minLength: 1}
        evidence_version: {type: string, pattern: '^[0-9a-f]{64}$'}
        protocol: {const: complete_journey_tissue_holdout_v1}
        fit_through_week: {type: integer, minimum: 1}
        baseline_weeks: {$ref: '#/components/schemas/WeekWindow'}
        campaign_weeks: {$ref: '#/components/schemas/WeekWindow'}
        metric: {const: control_adjusted_category_sales_lift}
        unit: {const: percentage_points}
        value: {type: number}
    HistoricalComparison:
      type: object
      additionalProperties: false
      required: [run_id, approval_id, revision, reference, prediction, status, reason]
      properties:
        run_id: {$ref: '#/components/schemas/Uuid'}
        approval_id: {$ref: '#/components/schemas/Uuid'}
        revision: {$ref: '#/components/schemas/Revision'}
        reference: {oneOf: [{$ref: '#/components/schemas/HistoricalCase'}, {type: 'null'}]}
        prediction: {oneOf: [{$ref: '#/components/schemas/HistoricalPrediction'}, {type: 'null'}]}
        status: {enum: [unavailable, reference_only, inside_range, outside_range]}
        reason: {enum: [snapshot_missing, source_unavailable, no_comparable_case, prediction_missing,
            incompatible_prediction, null]}
      oneOf:
        - properties:
            status: {const: unavailable}
            reason: {enum: [snapshot_missing, source_unavailable, no_comparable_case]}
            reference: {type: 'null'}
            prediction: {type: 'null'}
        - properties:
            status: {const: reference_only}
            reason: {enum: [prediction_missing, incompatible_prediction]}
            reference: {type: object}
            prediction: {type: 'null'}
        - properties:
            status: {enum: [inside_range, outside_range]}
            reason: {type: 'null'}
            reference: {type: object}
            prediction: {type: object}
    Uuid:
      type: string
      format: uuid
    Text:
      type: string
      minLength: 1
      pattern: '\S'
    Revision:
      type: integer
      minimum: 1
    Fraction:
      type: number
      minimum: 0
      maximum: 1
    RequestedChannel:
      type: string
      minLength: 1
      maxLength: 80
      pattern: '\S'
      description: Requested sales platform. Unsupported platforms stay visible in review and block simulation.
    Channel:
      type: string
      enum: [shopee, lazada, tiktok_shop, line, meta, google, offline]
    Objective:
      type: string
      enum: [incremental_profit, revenue, new_buyers, repeat_rate, awareness, leads]
      description: Planner intent. Approval requires verified measurement support for the selected objective.
    OfferKind:
      type: string
      enum: [percent_off, fixed_off, voucher]
      description: Candidate mechanics for execution. Exact terms and engine coverage still require verification.
    RequestedOfferKind:
      type: string
      enum: [percent_off, fixed_off, voucher, free_shipping, bundle, gift, coins_cashback, flash_sale]
      description: CampaignSpec v0.1 mechanics accepted as planner intent.
    DataVersions:
      type: object
      additionalProperties: false
      required: [catalog, market, segments, evaluation_policy]
      description: Null means the corresponding input version has yet to be resolved.
      properties:
        catalog: {type: [string, 'null'], minLength: 1}
        market: {type: [string, 'null'], minLength: 1}
        segments: {type: [string, 'null'], minLength: 1}
        evaluation_policy: {type: [string, 'null'], minLength: 1}
    PinnedDataVersions:
      allOf:
        - $ref: '#/components/schemas/DataVersions'
        - properties:
            catalog: {$ref: '#/components/schemas/Text'}
            market: {$ref: '#/components/schemas/Text'}
            segments: {$ref: '#/components/schemas/Text'}
            evaluation_policy: {$ref: '#/components/schemas/Text'}

    CreateReview:
      type: object
      additionalProperties: false
      anyOf:
        - required: [brief]
        - required: [fields]
      properties:
        brief:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '\S'
        fields:
          $ref: '#/components/schemas/PlannerFields'
    PlannerFields:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Lightweight planner input. The server assigns IDs and resolves evidence.
      properties:
        product_scope: {enum: [single_product, multiple_products]}
        alternative_policy: {enum: [half_discount, fixed_offer, agent_bounded]}
        regular_price_thb: {type: number, exclusiveMinimum: 0, maximum: 1000000000, description: "Regular price per pack."}
        cogs_thb: {type: number, minimum: 0, maximum: 1000000000, description: "Cost of goods per pack."}
        commission_pct: {type: number, minimum: 0, maximum: 100, description: "Commission percent of net merchandise receipts."}
        order_fee_thb: {type: number, minimum: 0, maximum: 1000000000, description: "Fixed seller fee per kept order."}
        fulfillment_thb: {type: number, minimum: 0, maximum: 1000000000, description: "Fulfillment per kept order."}
        voucher_fee_thb: {type: number, minimum: 0, maximum: 1000000000, description: "Service fee per redeemed voucher."}
        paid_media_thb: {type: number, minimum: 0, maximum: 1000000000000, description: "Committed campaign media charge included in the total budget."}
        profit_target_thb: {type: number, minimum: -1000000000000, maximum: 1000000000000, description: "Minimum median incremental contribution over the measurement window."}
        min_unit_contribution_thb: {type: number, minimum: -1000000000, maximum: 1000000000, description: "Minimum contribution per redeemed pack before fixed media."}
        max_loss_probability: {type: number, minimum: 0, maximum: 1, description: "Maximum share of seeds with negative incremental profit."}
        discount_response: {type: number, minimum: 0, maximum: 100, description: "Assumed proportional increase in purchase probability per unit discount fraction."}
        rival_demand_reduction_pct: {type: number, exclusiveMinimum: 0, maximum: 100, description: "Optional shared active-period S2 demand shock in percent."}
        stop_vouchers_at_utilization_pct: {type: number, exclusiveMinimum: 0, maximum: 100}
        stockup_days: {type: integer, minimum: 0, maximum: 42, description: "Days during which one induced purchase can displace one ordinary purchase."}
        post_days: {type: integer, minimum: 1, maximum: 42, description: "Number of follow-up days included in settlement and measurement."}
        product_hint: {$ref: '#/components/schemas/Text'}
        pack_hint: {$ref: '#/components/schemas/Text'}
        product_choice_id:
          $ref: '#/components/schemas/Text'
          description: Optional selection of an exact, server-supplied product choice.
        channel: {$ref: '#/components/schemas/RequestedChannel'}
        offer: {$ref: '#/components/schemas/OfferInput'}
        audience_hint: {$ref: '#/components/schemas/Text'}
        objective: {$ref: '#/components/schemas/Objective'}
        budget_thb: {type: number, minimum: 0, maximum: 1000000000000}
        start_date: {type: string, format: date, description: First active calendar day in the market.}
        end_date: {type: string, format: date, description: First calendar day after the campaign ends.}
    OfferInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        kind: {$ref: '#/components/schemas/RequestedOfferKind'}
        value: {type: number, exclusiveMinimum: 0}
        unit:
          type: string
          enum: [pct, THB]
          description: pct uses 0 to 100. THB is a fixed currency amount.
        min_spend_thb: {type: number, minimum: 0}
        cap_per_user: {type: integer, minimum: 1}
        eligibility: {type: string, enum: [all, new_only, members, segment_hint]}
      dependentRequired:
        value: [kind, unit]
        unit: [value]
      allOf:
        - if: {required: [kind], properties: {kind: {const: percent_off}}}
          then: {properties: {unit: {const: pct}}}
        - if: {required: [kind], properties: {kind: {enum: [fixed_off, free_shipping]}}}
          then: {properties: {unit: {const: THB}}}
        - if: {required: [unit], properties: {unit: {const: pct}}}
          then: {properties: {value: {maximum: 100}}}
    PlannerEdits:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        product_scope: {enum: [null, single_product, multiple_products]}
        alternative_policy: {enum: [null, half_discount, fixed_offer, agent_bounded]}
        regular_price_thb: {type: [number, 'null'], exclusiveMinimum: 0, maximum: 1000000000, description: "Regular price per pack."}
        cogs_thb: {type: [number, 'null'], minimum: 0, maximum: 1000000000, description: "Cost of goods per pack."}
        commission_pct: {type: [number, 'null'], minimum: 0, maximum: 100, description: "Commission percent of net merchandise receipts."}
        order_fee_thb: {type: [number, 'null'], minimum: 0, maximum: 1000000000, description: "Fixed seller fee per kept order."}
        fulfillment_thb: {type: [number, 'null'], minimum: 0, maximum: 1000000000, description: "Fulfillment per kept order."}
        voucher_fee_thb: {type: [number, 'null'], minimum: 0, maximum: 1000000000, description: "Service fee per redeemed voucher."}
        paid_media_thb: {type: [number, 'null'], minimum: 0, maximum: 1000000000000, description: "Committed campaign media charge included in the total budget."}
        profit_target_thb: {type: [number, 'null'], minimum: -1000000000000, maximum: 1000000000000, description: "Minimum median incremental contribution over the measurement window."}
        min_unit_contribution_thb: {type: [number, 'null'], minimum: -1000000000, maximum: 1000000000, description: "Minimum contribution per redeemed pack before fixed media."}
        max_loss_probability: {type: [number, 'null'], minimum: 0, maximum: 1, description: "Maximum share of seeds with negative incremental profit."}
        discount_response: {type: [number, 'null'], minimum: 0, maximum: 100, description: "Assumed proportional increase in purchase probability per unit discount fraction."}
        rival_demand_reduction_pct: {type: [number, 'null'], exclusiveMinimum: 0, maximum: 100, description: "Optional shared active-period S2 demand shock in percent."}
        stop_vouchers_at_utilization_pct: {type: [number, 'null'], exclusiveMinimum: 0, maximum: 100}
        stockup_days: {type: [integer, 'null'], minimum: 0, maximum: 42, description: "Days during which one induced purchase can displace one ordinary purchase."}
        post_days: {type: [integer, 'null'], minimum: 1, maximum: 42, description: "Number of follow-up days included in settlement and measurement."}
        product_hint: {type: [string, 'null'], minLength: 1, pattern: '\S'}
        pack_hint: {type: [string, 'null'], minLength: 1, pattern: '\S'}
        product_choice_id: {type: [string, 'null'], minLength: 1, pattern: '\S'}
        channel: {oneOf: [{$ref: '#/components/schemas/RequestedChannel'}, {type: 'null'}]}
        offer: {oneOf: [{$ref: '#/components/schemas/OfferInput'}, {type: 'null'}]}
        audience_hint: {type: [string, 'null'], minLength: 1, pattern: '\S'}
        objective: {oneOf: [{$ref: '#/components/schemas/Objective'}, {type: 'null'}]}
        budget_thb: {type: [number, 'null'], minimum: 0, maximum: 1000000000000}
        start_date: {type: [string, 'null'], format: date}
        end_date: {type: [string, 'null'], format: date}
    ReviseReview:
      type: object
      additionalProperties: false
      required: [base_revision]
      oneOf:
        - required: [answer]
          not: {anyOf: [{required: [edits]}, {required: [confirm]}]}
        - anyOf: [{required: [edits]}, {required: [confirm]}]
          not: {required: [answer]}
      properties:
        answer: {type: string, minLength: 1, maxLength: 1000, pattern: '\S'}
        base_revision: {$ref: '#/components/schemas/Revision'}
        edits: {$ref: '#/components/schemas/PlannerEdits'}
        confirm:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/Text'}

    ProductChoice:
      type: object
      additionalProperties: false
      required: [choice_id, product_id, pack_id, label, pack_label, channel, timezone, offer_kinds]
      properties:
        choice_id: {$ref: '#/components/schemas/Text'}
        product_id: {$ref: '#/components/schemas/Text'}
        pack_id: {$ref: '#/components/schemas/Text'}
        label: {$ref: '#/components/schemas/Text'}
        pack_label: {$ref: '#/components/schemas/Text'}
        channel: {$ref: '#/components/schemas/Channel'}
        timezone:
          $ref: '#/components/schemas/Text'
          description: IANA time zone for campaign dates, such as Asia/Bangkok.
        offer_kinds:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/OfferKind'}
    ResolvedOffer:
      type: object
      additionalProperties: false
      required: [offer_id, discount, funder, stackable, min_spend_basis, max_redemptions_per_order, eligible_order_scope]
      description: |
        Exact terms for the selected product, pack, channel and campaign
        dates. The server assigns the offer ID and verifies these terms.
      properties:
        offer_id: {$ref: '#/components/schemas/Text'}
        discount:
          allOf:
            - $ref: '#/components/schemas/OfferInput'
            - required: [kind, value, unit, eligibility]
              properties:
                kind: {$ref: '#/components/schemas/OfferKind'}
        funder: {type: string, enum: [seller, platform, shared]}
        stackable: {type: boolean}
        min_spend_basis:
          type: [string, 'null']
          minLength: 1
          description: Applicable subtotal for the threshold, or null if no threshold applies.
        max_redemptions_per_order: {type: integer, minimum: 1}
        eligible_order_scope: {$ref: '#/components/schemas/Text'}
      if:
        properties:
          discount: {required: [min_spend_thb]}
      then:
        properties:
          min_spend_basis: {$ref: '#/components/schemas/Text'}
    Segment:
      type: object
      additionalProperties: false
      required: [segment_id, name, households, share, weekly_purchase_probability, source]
      properties:
        segment_id: {$ref: '#/components/schemas/Text'}
        name: {$ref: '#/components/schemas/Text'}
        households: {type: integer, minimum: 50}
        share:
          $ref: '#/components/schemas/Fraction'
          description: Fraction of category-buying households in the source dataset.
        weekly_purchase_probability: {$ref: '#/components/schemas/Fraction'}
        source: {enum: [data, default]}
    SourceLabel:
      type: string
      enum: [data, llm_estimate, default]
    CostUnit:
      type: string
      enum: [THB_per_pack, THB_per_order, THB_per_campaign, THB_per_purchased_unit, THB_per_reach, pct]
    CostEvidence:
      type: object
      additionalProperties: false
      required: [status, value, unit, basis, source, evidence_ref, reason]
      properties:
        status: {type: string, enum: [confirmed, reference_only, unknown]}
        value: {type: [number, 'null'], minimum: 0}
        unit:
          oneOf: [{$ref: '#/components/schemas/CostUnit'}, {type: 'null'}]
          description: Null when the unit is unknown.
        basis:
          type: [string, 'null']
          minLength: 1
          description: Basis and scope of the charge, including the denominator for a percentage.
        source:
          oneOf: [{$ref: '#/components/schemas/SourceLabel'}, {type: 'null'}]
        evidence_ref:
          type: [string, 'null']
          minLength: 1
          description: Server-issued reference to the supporting source and its applicable terms.
        reason: {type: [string, 'null'], minLength: 1}
      allOf:
        - if: {properties: {status: {const: confirmed}}}
          then:
            properties:
              value: {type: number}
              unit: {$ref: '#/components/schemas/CostUnit'}
              basis: {$ref: '#/components/schemas/Text'}
              source: {enum: [data, default]}
              evidence_ref: {$ref: '#/components/schemas/Text'}
              reason: {type: 'null'}
        - if: {properties: {status: {const: reference_only}}}
          then:
            properties:
              value: {type: number}
              unit: {$ref: '#/components/schemas/CostUnit'}
              basis: {$ref: '#/components/schemas/Text'}
              source: {$ref: '#/components/schemas/SourceLabel'}
              evidence_ref: {$ref: '#/components/schemas/Text'}
              reason: {$ref: '#/components/schemas/Text'}
        - if: {properties: {status: {const: unknown}}}
          then:
            properties:
              value: {type: 'null'}
              reason: {$ref: '#/components/schemas/Text'}
        - if: {properties: {unit: {const: pct}}}
          then: {properties: {value: {maximum: 100}}}
      examples:
        - status: confirmed
          value: 0
          unit: THB_per_order
          basis: Per eligible redeemed order for the selected offer
          source: data
          evidence_ref: example-seller-fee-waiver
          reason: null
        - status: unknown
          value: null
          unit: null
          basis: null
          source: null
          evidence_ref: null
          reason: The seller voucher fee schedule is unavailable.
    Costs:
      type: object
      additionalProperties: false
      description: |
        The server returns applicable cost categories. Missing or
        reference-only material costs block approval. A confirmed zero
        requires evidence covering that charge and scope.
      properties:
        regular_price: {$ref: '#/components/schemas/CostEvidence'}
        cogs: {$ref: '#/components/schemas/CostEvidence'}
        channel_commission: {$ref: '#/components/schemas/CostEvidence'}
        payment_fee: {$ref: '#/components/schemas/CostEvidence'}
        voucher_service_fee: {$ref: '#/components/schemas/CostEvidence'}
        seller_fulfillment: {$ref: '#/components/schemas/CostEvidence'}
        paid_media: {$ref: '#/components/schemas/CostEvidence'}
        reimbursement: {$ref: '#/components/schemas/CostEvidence'}
        tax: {$ref: '#/components/schemas/CostEvidence'}
        returns: {$ref: '#/components/schemas/CostEvidence'}
    FieldPointer:
      type: string
      pattern: '^(/([^~/]|~[01])*)*$'
      description: JSON Pointer relative to the review response or the invalid request.
    Blocker:
      type: object
      additionalProperties: false
      required: [code, field, message]
      properties:
        code:
          type: string
          enum: [missing_input, conflicting_values, exact_product_required, exact_pack_required, unsupported_choice, offer_terms_unverified, missing_cost_basis, evaluation_unsupported]
        field: {$ref: '#/components/schemas/FieldPointer'}
        message: {$ref: '#/components/schemas/Text'}
      examples:
        - code: conflicting_values
          field: /facts/offer
          message: The brief says 20% and the form says 25%. Confirm the intended offer.
    Question:
      type: object
      additionalProperties: false
      required: [field, prompt, blocking]
      properties:
        field: {$ref: '#/components/schemas/FieldPointer'}
        prompt: {$ref: '#/components/schemas/Text'}
        blocking: {type: boolean}
    Candidate:
      type: object
      additionalProperties: false
      required: [candidate_id, field, value, brief_quote]
      description: A pending interpretation of the brief or latest interview answer, with supporting text from that turn.
      properties:
        candidate_id: {$ref: '#/components/schemas/Text'}
        field: {$ref: '#/components/schemas/FieldPointer'}
        value: {type: [string, number, object]}
        brief_quote: {$ref: '#/components/schemas/Text'}
    AgentState:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: {type: string, enum: [not_requested, completed, degraded]}
        reason: {type: [string, 'null'], enum: [null, provider_unavailable, timeout, invalid_response]}
      if: {properties: {status: {const: degraded}}}
      then: {properties: {reason: {type: string}}}
      else: {properties: {reason: {type: 'null'}}}
    FactOrigin:
      type: string
      enum: [planner, planner_confirmed_extraction, data, default]
    DateWindow:
      type: object
      additionalProperties: false
      required: [start_date, end_date]
      description: Local market dates with an exclusive end.
      properties:
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
    ScenarioId:
      type: string
      enum: [S1, S2, S3, S4]
    VoucherRules:
      type: array
      maxItems: 1
      items:
        type: object
        required: [rule, threshold_pct, tick, max_firings]
        properties:
          rule: {const: stop_vouchers_at_utilization}
          threshold_pct: {type: number, exclusiveMinimum: 0, maximum: 100}
          tick: {const: campaign_week_start}
          max_firings: {const: 1}
    EvaluationPlan:
      type: object
      additionalProperties: false
      required: [comparator, measurement_window, scenarios, max_loss_probability, goal_target]
      description: Backend-resolved evaluation terms shown for review before approval.
      properties:
        comparator: {type: string, const: paired_no_campaign}
        measurement_window: {$ref: '#/components/schemas/DateWindow'}
        scenarios:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/ScenarioId'}
        alternative_policy: {enum: [half_discount, fixed_offer, agent_bounded]}
        min_unit_contribution_thb: {type: [number, 'null']}
        contingency_rules: {$ref: '#/components/schemas/VoucherRules'}
        behavior:
          type: object
          required: [discount_response, stockup_days, rival_demand_reduction_pct]
          additionalProperties: false
          properties:
            discount_response: {type: number, minimum: 0, maximum: 100}
            stockup_days: {type: integer, minimum: 0, maximum: 42}
            rival_demand_reduction_pct: {type: number, minimum: 0, maximum: 100}
        assumptions:
          type: array
          items: {$ref: '#/components/schemas/Text'}
        max_loss_probability: {$ref: '#/components/schemas/Fraction'}
        goal_target:
          type: [object, 'null']
          additionalProperties: false
          required: [metric, minimum, unit]
          description: A policy-resolved numeric target, or null if no numeric target applies.
          properties:
            metric: {$ref: '#/components/schemas/Text'}
            minimum: {type: number}
            unit: {$ref: '#/components/schemas/Text'}
    Review:
      type: object
      additionalProperties: false
      required: [review_id, revision, status, category, facts, fact_origins,
        supported_product_choices, resolved_product, resolved_offer, data_versions,
        costs, segments, target_segment_ids, evaluation, candidates, blockers, questions, agent]
      description: |
        The server recomputes readiness each revision. A ready revision
        requires an exact product, commercial pack, channel, confirmed
        offer and material costs, complete campaign dates, audience, budget,
        measurement support, and immutable data versions. Dates use the
        market's local calendar. The end must follow the start by at most
        42 days for the current single-pack evaluator. An unavailable catalog returns empty
        choices and null resolved product. A generic category or manufacturer
        match carries contextual evidence only. An unverified offer is
        retained as planner input while resolved_offer stays null.

        A missing agent never erases answers. Approval can proceed after
        deterministic resolution of all blockers. Run agent calls through
        agents/llm.py with relevant sanitized text and permitted aggregates.
        The backend verifies candidates and evidence before exposing them.
      properties:
        review_id: {$ref: '#/components/schemas/Uuid'}
        revision: {$ref: '#/components/schemas/Revision'}
        status: {type: string, enum: [blocked, ready_for_approval]}
        category: {type: [string, 'null']}
        facts:
          type: object
          description: Resolved planner facts and explicit planner input. Pending candidates are separate.
          oneOf:
            - $ref: '#/components/schemas/PlannerFields'
            - maxProperties: 0
        catalog_evidence:
          type: object
          description: Frozen CT-CAMPAIGN-EVIDENCE v1 bundle with its source records.
          required: [reference, selection, capability, economics, segments, sources]
        commercial_inputs:
          type: object
          description: Extended planner inputs, separately exposed to preserve the editable legacy form. Supply them through fields and revise them through edits.
          anyOf:
            - {$ref: '#/components/schemas/PlannerFields'}
            - {maxProperties: 0}
        confirmed_quotes:
          type: object
          additionalProperties: {type: string}
        fact_origins:
          type: object
          description: Origins keyed by JSON Pointer. Every populated leaf under facts has an origin directly or via its nearest ancestor.
          propertyNames: {$ref: '#/components/schemas/FieldPointer'}
          additionalProperties: {$ref: '#/components/schemas/FactOrigin'}
        supported_product_choices:
          type: array
          items: {$ref: '#/components/schemas/ProductChoice'}
        resolved_product:
          oneOf: [{$ref: '#/components/schemas/ProductChoice'}, {type: 'null'}]
        resolved_offer:
          oneOf: [{$ref: '#/components/schemas/ResolvedOffer'}, {type: 'null'}]
        data_versions: {$ref: '#/components/schemas/DataVersions'}
        costs: {$ref: '#/components/schemas/Costs'}
        segments:
          type: array
          items: {$ref: '#/components/schemas/Segment'}
        target_segment_ids:
          type: [array, 'null']
          description: Resolved IDs from segments. An empty array means all eligible buyers. Null means unresolved.
          uniqueItems: true
          items: {$ref: '#/components/schemas/Text'}
        evaluation:
          oneOf: [{$ref: '#/components/schemas/EvaluationPlan'}, {type: 'null'}]
        candidates:
          type: array
          items: {$ref: '#/components/schemas/Candidate'}
        blockers:
          type: array
          items: {$ref: '#/components/schemas/Blocker'}
        questions:
          type: array
          items: {$ref: '#/components/schemas/Question'}
        agent: {$ref: '#/components/schemas/AgentState'}
      if: {properties: {status: {const: blocked}}}
      then: {properties: {blockers: {minItems: 1}}}
      else:
        properties:
          category: {$ref: '#/components/schemas/Text'}
          facts:
            required: [channel, offer, audience_hint, objective, budget_thb, start_date, end_date]
          supported_product_choices: {minItems: 1}
          resolved_product: {type: object}
          resolved_offer: {type: object}
          target_segment_ids: {type: array}
          evaluation: {type: object}
          data_versions: {$ref: '#/components/schemas/PinnedDataVersions'}
          costs:
            required: [regular_price, cogs]
            properties:
              regular_price:
                properties:
                  status: {const: confirmed}
                  unit: {const: THB_per_pack}
                  value: {exclusiveMinimum: 0}
              cogs:
                properties:
                  status: {const: confirmed}
                  unit: {const: THB_per_pack}
            additionalProperties:
              properties:
                status: {const: confirmed}
          blockers: {maxItems: 0}
          questions: {items: {properties: {blocking: {const: false}}}}

    ApproveReview:
      type: object
      additionalProperties: false
      required: [revision, confirmed]
      properties:
        revision: {$ref: '#/components/schemas/Revision'}
        confirmed: {type: boolean, const: true}
    Approval:
      type: object
      additionalProperties: false
      required: [approval_id, review_id, revision, approved_at, data_versions]
      properties:
        approval_id: {$ref: '#/components/schemas/Uuid'}
        review_id: {$ref: '#/components/schemas/Uuid'}
        revision: {$ref: '#/components/schemas/Revision'}
        approved_at: {type: string, format: date-time}
        data_versions: {$ref: '#/components/schemas/PinnedDataVersions'}
    SubmitRun:
      type: object
      additionalProperties: false
      required: [approval_id, submission_id]
      properties:
        approval_id: {$ref: '#/components/schemas/Uuid'}
        submission_id:
          $ref: '#/components/schemas/Uuid'
          description: Client-generated submission ID. Reuse it after transport failure.
        retry_of_run_id: {$ref: '#/components/schemas/Uuid'}
    RunAccepted:
      type: object
      additionalProperties: false
      required: [run_id, status_url]
      properties:
        run_id: {$ref: '#/components/schemas/Uuid'}
        status_url: {type: string, format: uri-reference}
    RunFailure:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: {type: string, enum: [worker_timeout, worker_unavailable, invalid_approved_input, evaluation_failed, report_generation_failed]}
        message: {$ref: '#/components/schemas/Text'}
        retryable: {type: boolean}
      if: {properties: {code: {const: invalid_approved_input}}}
      then: {properties: {retryable: {const: false}}}
    RunState:
      type: object
      additionalProperties: false
      required: [run_id, status, progress, poll_after_seconds, report_url, failure]
      properties:
        run_id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, enum: [queued, running, done, error]}
        progress: {$ref: '#/components/schemas/Fraction'}
        poll_after_seconds: {type: [integer, 'null'], minimum: 1}
        report_url: {type: [string, 'null'], format: uri-reference}
        failure:
          oneOf: [{$ref: '#/components/schemas/RunFailure'}, {type: 'null'}]
      allOf:
        - if: {properties: {status: {enum: [queued, running]}}}
          then:
            properties:
              progress: {exclusiveMaximum: 1}
              poll_after_seconds: {type: integer}
              report_url: {type: 'null'}
              failure: {type: 'null'}
        - if: {properties: {status: {const: queued}}}
          then: {properties: {progress: {const: 0}}}
        - if: {properties: {status: {const: done}}}
          then:
            properties:
              progress: {const: 1}
              poll_after_seconds: {type: 'null'}
              report_url: {type: string}
              failure: {type: 'null'}
        - if: {properties: {status: {const: error}}}
          then:
            properties:
              poll_after_seconds: {type: 'null'}
              report_url: {type: 'null'}
              failure: {type: object}

    Percentiles:
      type: object
      additionalProperties: false
      required: [p10, p50, p90]
      description: Seed-wise percentiles in ascending order, within one scenario.
      properties:
        p10: {type: number}
        p50: {type: number}
        p90: {type: number}
    EvaluatedMetric:
      type: object
      additionalProperties: false
      required: [metric, unit, status, value, unavailable_reason]
      description: |
        Incremental profit and new buyers are campaign-minus-baseline.
        For synthetic-voucher-v2 incremental ROAS uses paired incremental net receipts
        divided by incremental media spend. Legacy synthetic-tissue-v1 used seller subsidy.
        Campaign iROI uses incremental contribution divided by voucher plus media spend. Leakage is the share of evaluated subsidy going to
        purchases that would occur in the paired baseline. Probability
        metrics use fractions across paired seeds. The pinned evaluation
        policy defines denominators, horizon, and aggregation details.
      properties:
        metric:
          type: string
          enum: [incremental_profit, incremental_roas, subsidy_leakage, incremental_new_buyers, probability_hit_target, probability_loss, orders, units, redemptions, gross_sales, seller_subsidy, net_receipts, cogs, channel_commission, order_fees, fulfillment, voucher_fees, media_spend, campaign_spend, contribution_profit, incremental_units, incremental_campaign_buyers, incremental_net_receipts, campaign_iroi, post_incremental_units, platform_roas, impressions, clicks, click_through_rate, conversion_rate, cumulative_incremental_profit, incremental_profit_before_media, profit_vs_original, repeat_rate, pull_forward_share, budget_utilization]
        unit: {type: string, enum: [THB, ratio, fraction, buyers, orders, units, impressions, clicks]}
        status: {type: string, enum: [available, unavailable]}
        value:
          oneOf: [{$ref: '#/components/schemas/Percentiles'}, {type: number}, {type: 'null'}]
        unavailable_reason:
          type: [string, 'null']
          enum: [null, missing_evidence, insufficient_sample, undefined_denominator, measurement_unsupported]
      allOf:
        - if: {properties: {status: {const: unavailable}}}
          then: {properties: {value: {type: 'null'}, unavailable_reason: {type: string}}}
          else: {properties: {unavailable_reason: {type: 'null'}}}
        - if: {properties: {metric: {enum: [probability_hit_target, probability_loss]}}}
          then:
            properties:
              unit: {const: fraction}
              value: {type: [number, 'null'], minimum: 0, maximum: 1}
          else:
            properties:
              value: {type: [object, 'null']}
        - if: {properties: {status: {const: available}}}
          then: {properties: {value: {type: [number, object]}}}
        - if: {properties: {metric: {const: incremental_profit}}}
          then: {properties: {unit: {const: THB}}}
        - if: {properties: {metric: {const: incremental_roas}}}
          then: {properties: {unit: {const: ratio}}}
        - if: {properties: {metric: {const: incremental_new_buyers}}}
          then: {properties: {unit: {const: buyers}}}
        - if: {properties: {metric: {const: subsidy_leakage}}}
          then:
            properties:
              unit: {const: fraction}
              value:
                properties:
                  p10: {$ref: '#/components/schemas/Fraction'}
                  p50: {$ref: '#/components/schemas/Fraction'}
                  p90: {$ref: '#/components/schemas/Fraction'}
    SeedLedger:
      type: object
      additionalProperties: false
      description: One paired simulated seed over the full measurement window. Money is in THB. Overlapping subsidy uses campaign-window paired purchasers.
      required: [seed, orders, units, redemptions, gross_sales, seller_subsidy, net_receipts, cogs, channel_commission, order_fees, fulfillment, voucher_fees, media_spend, campaign_spend, contribution_profit, baseline_units, incremental_units, baseline_contribution, incremental_profit, incremental_net_receipts, post_incremental_units, overlapping_subsidy, incremental_campaign_buyers]
      properties:
        seed: {type: integer}
        orders: {type: integer}
        units: {type: integer}
        redemptions: {type: integer}
        gross_sales: {type: number}
        seller_subsidy: {type: number}
        net_receipts: {type: number}
        cogs: {type: number}
        channel_commission: {type: number}
        order_fees: {type: number}
        fulfillment: {type: number}
        voucher_fees: {type: number}
        media_spend: {type: number}
        campaign_spend: {type: number}
        contribution_profit: {type: number}
        baseline_units: {type: integer}
        incremental_units: {type: integer}
        baseline_contribution: {type: number}
        incremental_profit: {type: number}
        incremental_net_receipts: {type: number}
        post_incremental_units: {type: integer}
        overlapping_subsidy: {type: number}
        campaign_buyers: {type: integer, minimum: 0}
        repeat_buyers: {type: integer, minimum: 0}
        incremental_campaign_buyers: {type: integer}
    PeriodResult:
      type: object
      required: [start_date, end_date, phase, metrics]
      properties:
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
        phase: {enum: [campaign, post]}
        metrics: {type: array, items: {$ref: '#/components/schemas/EvaluatedMetric'}}
    ScenarioResult:
      type: object
      additionalProperties: false
      required: [scenario, metrics, rule_events, paired_seed_count, seed_ledgers, period_results, weekly, audience]
      properties:
        scenario: {$ref: '#/components/schemas/ScenarioId'}
        rule_events:
          type: array
          items:
            type: object
            required: [seed, rule, date, observed_pct]
            properties:
              seed: {type: integer}
              rule: {const: stop_vouchers_at_utilization}
              date: {type: string, format: date}
              observed_pct: {type: number, minimum: 0, maximum: 100}
        paired_seed_count: {type: integer, minimum: 1}
        seed_ledgers:
          type: array
          items: {$ref: '#/components/schemas/SeedLedger'}
        period_results: {type: array, items: {$ref: '#/components/schemas/PeriodResult'}}
        weekly: {type: array, items: {$ref: '#/components/schemas/PeriodResult'}}
        audience:
          type: array
          items:
            type: object
            required: [segment_id, metrics]
            properties:
              segment_id: {type: string}
              metrics: {type: array, items: {$ref: '#/components/schemas/EvaluatedMetric'}}
        metrics:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/EvaluatedMetric'}
    Decision:
      type: object
      additionalProperties: false
      required: [status, reason_code, explanation]
      properties:
        status:
          type: string
          enum: [proceed, hold, insufficient_evidence]
          description: |
            Proceed when decision evidence passes the pinned gates. Hold
            when sufficient evidence shows a target or guardrail failure.
            Insufficient evidence when any decision-critical check cannot
            be evaluated to the policy's required coverage.
        reason_code:
          type: string
          enum: [passed, target_missed, guardrail_failed, missing_decision_evidence]
        explanation: {$ref: '#/components/schemas/Text'}
      allOf:
        - if: {properties: {status: {const: proceed}}}
          then: {properties: {reason_code: {const: passed}}}
        - if: {properties: {status: {const: hold}}}
          then: {properties: {reason_code: {enum: [target_missed, guardrail_failed]}}}
        - if: {properties: {status: {const: insufficient_evidence}}}
          then: {properties: {reason_code: {const: missing_decision_evidence}}}
    PlanInput:
      type: object
      additionalProperties: false
      description: Frozen effective inputs for one evaluated plan in the pinned synthetic policy.
      required: [plan_id, role, parent_plan_id, paired_baseline_id, changes, approval_id,
        review_id, revision, data_versions, product, offer, currency, subsidy_budget, costs,
        campaign_window, segments, target_segment_ids, evaluation, seeds, contingency_rules]
      properties:
        plan_id: {$ref: '#/components/schemas/Text'}
        role: {enum: [original, conservative, baseline]}
        parent_plan_id: {type: [string, 'null']}
        paired_baseline_id: {$ref: '#/components/schemas/Text'}
        changes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, before, after, reason]
            properties:
              field: {$ref: '#/components/schemas/FieldPointer'}
              before: {type: number}
              after: {type: number}
              reason: {$ref: '#/components/schemas/Text'}
        approval_id: {$ref: '#/components/schemas/Uuid'}
        review_id: {$ref: '#/components/schemas/Uuid'}
        revision: {$ref: '#/components/schemas/Revision'}
        data_versions: {$ref: '#/components/schemas/PinnedDataVersions'}
        product: {$ref: '#/components/schemas/ProductChoice'}
        offer:
          oneOf: [{$ref: '#/components/schemas/ResolvedOffer'}, {type: 'null'}]
        currency: {const: THB}
        total_budget_thb: {type: number, minimum: 0}
        subsidy_budget: {type: number, minimum: 0}
        costs: {$ref: '#/components/schemas/Costs'}
        campaign_window: {$ref: '#/components/schemas/DateWindow'}
        segments:
          type: array
          items: {$ref: '#/components/schemas/Segment'}
        target_segment_ids:
          type: array
          items: {$ref: '#/components/schemas/Text'}
        evaluation: {$ref: '#/components/schemas/EvaluationPlan'}
        seeds:
          type: array
          items: {type: integer}
        contingency_rules: {$ref: '#/components/schemas/VoucherRules'}
    VoucherProposal:
      type: object
      required: [source, reason, value]
      properties:
        source: {enum: [llm_estimate, default]}
        reason: {type: string}
        model: {type: string}
        value: {type: [number, 'null']}
    RunInput:
      type: object
      additionalProperties: false
      required: [run_id, approval_id, review]
      properties:
        run_id: {$ref: '#/components/schemas/Uuid'}
        approval_id: {$ref: '#/components/schemas/Uuid'}
        review: {$ref: '#/components/schemas/Review'}
        strategy_proposal: {$ref: '#/components/schemas/VoucherProposal'}
    BusinessEvidence:
      type: object
      required: [commercial_terms, scenario_basis, customer_voice, source, measurement_scope, historical_comparison_url]
      properties:
        source: {const: paired_simulation}
        measurement_scope: {const: one_kept_pack_per_order}
        historical_comparison_url: {type: string, format: uri-reference}
        commercial_terms:
          type: object
          required: [total, planner_provided, catalog_data, assumed_or_synthetic]
          additionalProperties: {type: integer, minimum: 0}
        commercial_evidence_classes:
          type: object
          description: Counts each effective commercial term by its pinned evidence class.
          propertyNames:
            enum: [business_input, observed_local_market, transferred_behavior, assumption, synthetic_fixture, unavailable]
          required: [business_input, observed_local_market, transferred_behavior, assumption, synthetic_fixture, unavailable]
          additionalProperties: {type: integer, minimum: 0}
        scenario_basis:
          type: array
          items:
            type: object
            required: [scenario, type, active_demand_reduction_pct, likelihood, reason]
            properties:
              scenario: {$ref: '#/components/schemas/ScenarioId'}
              type: {enum: [passive, assumed_stress]}
              active_demand_reduction_pct: {type: number, minimum: 0, maximum: 100}
              likelihood: {type: 'null'}
              reason: {type: string}
        customer_voice:
          type: object
          required: [status, reason]
          properties:
            status: {const: unavailable}
            reason: {type: string}
    BusinessEvaluation:
      type: object
      additionalProperties: false
      required: [run_id, approval_id, review_id, revision, evaluation_policy, comparator,
        measurement_window, decision, checks, comparisons, checks_unavailable_reason, evidence, recommendation]
      properties:
        run_id: {$ref: '#/components/schemas/Uuid'}
        approval_id: {$ref: '#/components/schemas/Uuid'}
        review_id: {$ref: '#/components/schemas/Uuid'}
        revision: {$ref: '#/components/schemas/Revision'}
        evaluation_policy: {type: string}
        comparator: {const: paired_no_campaign}
        measurement_window: {$ref: '#/components/schemas/DateWindow'}
        evidence: {$ref: '#/components/schemas/BusinessEvidence'}
        recommendation: {$ref: '#/components/schemas/PlanRecommendation'}
        decision: {$ref: '#/components/schemas/Decision'}
        checks_unavailable_reason: {type: [string, 'null']}
        comparisons:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [role, plan_id, discount_pct, scenario_results]
            properties:
              role: {enum: [original, conservative, baseline]}
              plan_id: {type: [string, 'null']}
              discount_pct: {type: [number, 'null']}
              scenario_results:
                type: array
                items: {$ref: '#/components/schemas/ScenarioResult'}
        checks:
          type: array
          description: Original-plan gates. An unavailable leakage metric prevents a decision.
          items: {$ref: '#/components/schemas/BusinessGate'}
    BusinessGate:
      type: object
      additionalProperties: false
      required: [scenario, metric, statistic, unit, observed, condition, threshold,
        status, unavailable_reason]
      properties:
        scenario: {$ref: '#/components/schemas/ScenarioId'}
        metric: {enum: [incremental_profit, probability_loss, subsidy_leakage, unit_contribution, campaign_spend]}
        statistic: {enum: [p50, value, max]}
        unit: {enum: [THB, fraction, THB_per_pack]}
        observed: {type: [number, 'null']}
        condition: {enum: [available, at_least, at_most]}
        threshold: {type: [number, 'null']}
        status: {enum: [pass, fail, unavailable]}
        unavailable_reason: {type: [string, 'null']}
    PlanRecommendation:
      type: object
      required: [status, selected_plan_id, assessments]
      properties:
        status: {enum: [keep, revise, hold, insufficient_evidence]}
        strategy: {$ref: '#/components/schemas/VoucherProposal'}
        confidence:
          type: object
          required: [label, reasons, rubric]
          properties:
            label: {enum: [low, unscorable]}
            reasons: {type: array, items: {type: string}}
            rubric: {type: string}
        alternative_shortfall: {type: [string, 'null']}
        reason: {type: string}
        selected_plan_id: {type: [string, 'null']}
        assessments:
          type: array
          items:
            type: object
            required: [plan_id, role, eligibility, worst_p10_profit_thb, checks, versus_original]
            properties:
              plan_id: {type: string}
              role: {enum: [original, conservative]}
              eligibility: {enum: [eligible, ineligible, unscorable]}
              worst_p10_profit_thb: {type: number}
              checks: {type: array, items: {$ref: '#/components/schemas/BusinessGate'}}
              versus_original:
                type: array
                items:
                  type: object
                  required: [scenario, metric]
                  properties:
                    scenario: {$ref: '#/components/schemas/ScenarioId'}
                    metric: {$ref: '#/components/schemas/EvaluatedMetric'}
    RunReport:
      type: object
      additionalProperties: false
      required: [run_id, approval_id, review_id, revision, data_versions, comparator, evaluated_at, measurement_window, scenario_results, decision, plan_results, evidence, recommendation]
      description: |
        Include each evaluated scenario once, with each policy-required
        metric present exactly once even when unavailable. Percentiles are
        model outputs for the pinned run. Scenario labels refer to its
        configured rival scenarios.
      properties:
        run_id: {$ref: '#/components/schemas/Uuid'}
        approval_id: {$ref: '#/components/schemas/Uuid'}
        review_id: {$ref: '#/components/schemas/Uuid'}
        revision: {$ref: '#/components/schemas/Revision'}
        data_versions: {$ref: '#/components/schemas/PinnedDataVersions'}
        comparator: {type: string, const: paired_no_campaign}
        evaluated_at: {type: string, format: date-time}
        measurement_window:
          $ref: '#/components/schemas/DateWindow'
          description: Includes any approved post-campaign window.
        scenario_results:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ScenarioResult'}
        plan_results:
          type: array
          items:
            type: object
            required: [role, input, discount_pct, scenario_results]
            properties:
              role: {enum: [original, conservative, baseline]}
              input: {$ref: '#/components/schemas/PlanInput'}
              discount_pct: {type: number, minimum: 0, maximum: 30}
              scenario_results:
                type: array
                items: {$ref: '#/components/schemas/ScenarioResult'}
        evidence: {$ref: '#/components/schemas/BusinessEvidence'}
        recommendation: {$ref: '#/components/schemas/PlanRecommendation'}
        decision: {$ref: '#/components/schemas/Decision'}
        commentary: {$ref: '#/components/schemas/Text'}
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_request, not_found, stale_review, incomplete_review, submission_id_conflict, approval_stale, retry_not_allowed, retry_already_submitted, report_pending, run_failed, ambiguous_period, unknown_choice, choose_explicitly, answer_unresolved, infeasible_volume, what_if_unavailable]
        message: {$ref: '#/components/schemas/Text'}
        current_revision: {$ref: '#/components/schemas/Revision'}
        agent: {$ref: '#/components/schemas/AgentState'}
        current_review: {$ref: '#/components/schemas/Review'}
        run_id: {$ref: '#/components/schemas/Uuid'}
        blockers:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Blocker'}
        issues:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field: {$ref: '#/components/schemas/FieldPointer'}
              message: {$ref: '#/components/schemas/Text'}
      allOf:
        - if: {properties: {code: {const: stale_review}}}
          then: {required: [current_revision, current_review]}
        - if: {properties: {code: {const: incomplete_review}}}
          then: {required: [current_revision, blockers]}
        - if: {properties: {code: {const: retry_already_submitted}}}
          then: {required: [run_id]}

