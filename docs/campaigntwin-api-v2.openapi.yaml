openapi: 3.1.0
info:
  title: CampaignTwin Seller API
  version: 2.0.0
  description: |
    Start a seller interview with a brief, structured fields, selling dates or an empty object.
    The session includes the current review revision, the next question, cost and policy inputs,
    unit economics and action links. Approve a complete revision and submit it for a rehearsal.
    The report and business evaluation use the same saved paired simulation results.
    Reviews, approvals, submission identifiers and runs belong to the API version that created them.

servers:
  - url: /

tags:
  - name: Campaign reviews
  - name: Runs

x-data-sources:
  market_and_costs: |
    load_market and load_unit_econ expose simulated category economics in THB
    using a default exchange rate. The reference price is per purchased unit.
    The marketplace fee and cost defaults have no verified seller terms.
    load_knobs provides category planning ranges and generic mechanics.
  catalog: |
    load_brands supplies manufacturer-level records. The current loaders
    supply no approved seller catalog joining exact SKUs, pack sizes,
    channels, supported offers and the applicable seller cost terms.
    load_campaign_evidence_snapshot supplies dated CT-CAMPAIGN-EVIDENCE v1 configurations.
    Its bundled rice example and the tissue demo have synthetic commercial assumptions.
    load_demo_brief supplies a scripted toilet-tissue rehearsal as an
    intake example. It supplies no verified seller catalog or cost schedule.
  segments: |
    load_segments provides segment IDs, counts, shares and weekly purchase
    probabilities. load_market exposes the same aggregate counts and rates.
    Release only household-derived cells with at least 50 distinct households.
    Keep household-level data out of API responses and agent prompts.
    The current segment data comes from a simulated US grocery dataset.
  versions: |
    Use immutable IDs for the released inputs and evaluation policy.
    load_source_manifest supports input lineage. The manifest format
    version alone is insufficient to pin a released dataset.

paths:
  /api/v2:
    get:
      tags:
      - Campaign reviews
      summary: Discover the seller interview and simulation handoff
      operationId: discoverSellerApi
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                required:
                - version
                - create_review
                - docs
                - schema
                - simulation_schema
                - opening_prompt
                - example
                - business_inputs
                properties:
                  version:
                    type: string
                  create_review:
                    type: string
                  docs:
                    type: string
                  schema:
                    type: string
                  simulation_schema:
                    type: string
                  opening_prompt:
                    type: string
                  example:
                    $ref: '#/components/schemas/Start'
                  business_inputs:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
  /api/v2/campaign-reviews/{review_id}/turns:
    post:
      tags:
      - Campaign reviews
      summary: Answer, choose a suggestion, or correct business inputs
      operationId: answerSellerInterview
      parameters:
      - name: review_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Review Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/Reply'
              - $ref: '#/components/schemas/Choose'
              - $ref: '#/components/schemas/Change'
              title: Payload
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The revision changed or the review is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/campaign-reviews/{review_id}/what-if:
    post:
      tags:
      - Campaign reviews
      summary: Check the profit hurdle for assumed voucher volumes
      operationId: evaluateVoucherVolume
      parameters:
      - name: review_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Review Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeCase'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeResult'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The revision changed or the review is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/campaign-reviews:
    post:
      tags: [Campaign reviews]
      operationId: createCampaignReview
      x-implementation-status: implemented
      summary: Create a campaign review
      description: |
        Save revision 1 from the brief, form, or both. Return supported exact
        choices, resolved facts, pending suggestions and questions. The
        deterministic checks run even when brief extraction fails.
        Explicit form values are preserved. A conflicting extraction becomes
        a candidate and a field-level blocker until the planner resolves it.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Start'}
            examples:
              sellerMarginCheck:
                summary: Synthetic tissue with planner-supplied costs and contribution floor
                value:
                  fields:
                    product_choice_id: demo-tissue-12-shopee
                    audience_hint: all
                    objective: incremental_profit
                    start_date: '2026-12-01'
                    end_date: '2026-12-08'
                    offer: {kind: voucher, value: 10, unit: THB, eligibility: all}
                    budget_thb: 1000
                    order_fee_thb: 2
                    min_unit_contribution_thb: 32
                    profit_target_thb: 25
                    discount_response: 8
              evidenceVoucher:
                summary: Dated synthetic Shopee catalog entry with commission and fulfillment
                value:
                  fields:
                    product_choice_id: fixture-th-shopee-rice-fixed-voucher
                    audience_hint: all
                    objective: incremental_profit
                    start_date: '2026-12-01'
                    end_date: '2026-12-08'
                    offer: {kind: voucher, value: 20, unit: THB, eligibility: all, min_spend_thb: 120}
                    budget_thb: 2500
                    profit_target_thb: 25
                    min_unit_contribution_thb: 10
                    post_days: 7
              syntheticRehearsal:
                summary: Runnable synthetic comparison
                value:
                  fields:
                    product_choice_id: demo-tissue-12-shopee
                    channel: shopee
                    objective: incremental_profit
                    audience_hint: all
                    budget_thb: 1000
                    start_date: '2026-12-01'
                    end_date: '2026-12-08'
                    offer: {kind: voucher, value: 10, unit: THB, eligibility: all}
              toiletTissue:
                summary: A toilet-tissue brief with a partial form
                value:
                  brief: Give deal hunters 20% off toilet tissue on Shopee for 12.12.
                  fields:
                    channel: shopee
                    offer: {kind: percent_off, value: 20, unit: pct}
              fixedDiscount:
                summary: A form-only request for a fixed discount on a pack
                value:
                  fields:
                    product_hint: Toilet tissue
                    pack_hint: 12 rolls
                    offer: {kind: fixed_off, value: 20, unit: THB}
              briefOnly:
                value: {brief: Run a payday campaign for toilet tissue on Shopee.}
              conflictingOffer:
                summary: The brief and form give different amounts
                value:
                  brief: Give shoppers 20% off toilet tissue.
                  fields:
                    offer: {kind: percent_off, value: 25, unit: pct}
      responses:
        '201':
          description: Revision 1 was saved with its facts and any blockers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '422': {$ref: '#/components/responses/InvalidRequest'}

  /api/v2/campaign-reviews/{review_id}:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    get:
      tags: [Campaign reviews]
      operationId: getCampaignReview
      summary: Resume the current review revision
      responses:
        '200':
          description: Current saved review and clarification questions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidRequest'}

  /api/v2/campaign-reviews/{review_id}/revisions:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    post:
      tags: [Campaign reviews]
      operationId: reviseCampaignReview
      x-implementation-status: implemented
      summary: Revise a campaign review
      description: |
        Send answer to continue the interview in natural language. The server
        interprets it against the current review and returns evidence-backed
        candidates for explicit confirmation. Use a separate revision to confirm
        candidates or edit fields manually. Every write checks base_revision.
        Omitted edit keys carry forward. A null clears the named field.
        A supplied object replaces the whole field, including the offer.
        Valid input that cannot be matched to a supported choice is saved
        with a field-level blocker.
        Confirm only candidate IDs issued for this base revision. An edit
        to a conflicted field explicitly resolves the conflict. Confirming
        a candidate adopts its value. Editing and confirming that same
        field, confirming competing values, or confirming a candidate made
        inapplicable by an edit returns 422 without saving.
        Preserve unaffected prior answers. Changes to product, pack, channel,
        offer, or dates revalidate dependent facts and their evidence.
        If enrichment fails, save the valid edits and confirmations, keep
        prior applicable answers and suggestions, and return deterministic
        questions with agent.status degraded. Reissue reachable candidate
        IDs for the new revision. Stale writes return 409 with the current
        review for rebasing.
        Retain versioned inputs across revisions while they remain applicable.
        Review newly available evidence in a new revision before approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviseReview'}
            examples:
              answerQuestion:
                value: {base_revision: 1, answer: "Give everyone a 10 THB voucher and cap the total budget at 1000 THB."}
              editPackAndOffer:
                value:
                  base_revision: 1
                  edits:
                    pack_hint: 12 rolls
                    offer: {kind: voucher, value: 20, unit: THB}
              confirmAudience:
                value: {base_revision: 1, confirm: [candidate-audience]}
      responses:
        '201':
          description: The next revision was saved with its facts and any blockers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/StaleReview'}
        '422': {$ref: '#/components/responses/InvalidRequest'}

  /api/v2/campaign-reviews/{review_id}/approvals:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    post:
      tags: [Campaign reviews]
      operationId: approveCampaignReview
      x-implementation-status: implemented
      summary: Approve the exact review revision
      description: |
        Require explicit confirmation. The localhost server records the configured
        workspace planner identity. Atomically verify the
        named revision is current and complete. Record the actor, revision
        and approval time with the frozen facts, applicable cost evidence,
        comparison inputs and data versions. An eligible repeat request
        for the same revision returns the existing receipt. Appending a
        revision supersedes prior approvals for new submissions.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApproveReview'}
            example: {revision: 3, confirmed: true}
      responses:
        '201': {$ref: '#/components/responses/ApprovalReceipt'}
        '200': {$ref: '#/components/responses/ApprovalReceipt'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The revision is stale or has unresolved blockers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                stale:
                  $ref: '#/components/examples/StaleReview'
                blocked:
                  value:
                    code: incomplete_review
                    message: Approve only after resolving every blocker.
                    current_revision: 2
                    blockers:
                      - code: missing_cost_basis
                        field: /costs/voucher_service_fee
                        message: Provide an applicable seller fee schedule through the evidence owner.
        '422': {$ref: '#/components/responses/InvalidRequest'}

  /api/v2/runs:
    post:
      tags: [Runs]
      operationId: submitRun
      x-implementation-status: implemented
      summary: Submit an approved review for simulation
      description: |
        Resolve the approved inputs on the server. Atomically bind the
        submission ID to its approval, optional retry parent, and new run.
        A submission ID is unique within the caller's workspace. Reusing it
        with the same normalized inputs returns 200 and the original run ID,
        even after terminal status or later review edits. Reuse with different
        inputs returns 409. Concurrent identical submissions create one run.

        For a new submission the approval must still be current and its
        pinned inputs usable. Withdrawn inputs invalidate new admissions.
        Retry a terminal error with retryable=true using a
        fresh submission ID, the same approval ID and retry_of_run_id.
        Retry creates a separate run using the same approved inputs and
        random-seed policy. Each failed run permits one direct retry.
        A repeat of the same retry submission ID returns its existing run.
        A retry racing with another submission for the same parent returns
        409 with the existing retry run ID when the winning ID differs.
        Existing run records and reports keep their saved inputs.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitRun'}
            examples:
              firstRun:
                value:
                  approval_id: '28667642-6a6f-4f80-8e53-d8427c10a946'
                  submission_id: '0993a4c0-421c-46ba-88f5-14e0244e9e40'
              retry:
                value:
                  approval_id: '28667642-6a6f-4f80-8e53-d8427c10a946'
                  submission_id: '19af0197-b9bc-4276-aae3-63c95b16ca09'
                  retry_of_run_id: '942947fc-2b22-41bb-8ee2-2d8fbfd50edd'
      responses:
        '202': {$ref: '#/components/responses/RunAccepted'}
        '200': {$ref: '#/components/responses/RunAccepted'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Submission ID collision, stale approval, or ineligible retry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                collision:
                  value: {code: submission_id_conflict, message: This ID is bound to different inputs.}
                stale:
                  value: {code: approval_stale, message: Approve the current review before submitting.}
                retryAlreadySubmitted:
                  value:
                    code: retry_already_submitted
                    message: A retry exists for this failed run.
                    run_id: 'f0425de1-73c5-4bc4-97eb-bb2fd4230693'
                retryNotAllowed:
                  value: {code: retry_not_allowed, message: This run is ineligible for retry under the supplied approval.}
        '422': {$ref: '#/components/responses/InvalidRequest'}

  /api/v2/runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRunStatus
      x-implementation-status: implemented
      summary: Poll the run
      description: |
        Admission persists before a background worker evaluates the pinned review.
        Poll the submitted run at the indicated interval while queued or
        running. Progress is a nondecreasing fraction for this run. Done
        means its immutable report is available. Error is a terminal run
        state returned with HTTP 200 and a typed failure. A retry is polled
        using its own run ID.
      responses:
        '200':
          description: Current state of the requested run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunState'}
              examples:
                running:
                  value:
                    run_id: '942947fc-2b22-41bb-8ee2-2d8fbfd50edd'
                    status: running
                    progress: 0.4
                    poll_after_seconds: 2
                    report_url: null
                    failure: null
                failed:
                  value:
                    run_id: '942947fc-2b22-41bb-8ee2-2d8fbfd50edd'
                    status: error
                    progress: 0.4
                    poll_after_seconds: null
                    report_url: null
                    failure: {code: worker_timeout, message: The worker timed out., retryable: true}
                done:
                  value:
                    run_id: 'f0425de1-73c5-4bc4-97eb-bb2fd4230693'
                    status: done
                    progress: 1
                    poll_after_seconds: null
                    report_url: /api/v2/runs/f0425de1-73c5-4bc4-97eb-bb2fd4230693/report
                    failure: null
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidRequest'}

  /api/v2/runs/{run_id}/input:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRunInput
      summary: Inspect the exact approved revision supplied to the evaluator
      responses:
        '200':
          description: Frozen evaluator arguments, including resolved context and field origins.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunInput'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidRequest'}

  /api/v2/runs/{run_id}/evaluation:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getBusinessEvaluation
      summary: Compare simulated plans and inspect the submitted plan's decision checks
      responses:
        '200':
          description: Paired model outcomes and decision evidence from the stored run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BusinessEvaluation'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The run has no completed report.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/InvalidRequest'}

  /api/v2/runs/{run_id}/report:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRunReport
      x-implementation-status: implemented
      summary: Read the evaluated report for the requested run
      description: |
        Return evaluated output for this run ID, its approved revision and
        pinned input versions. Scenario results compare the approved campaign
        to a paired no-campaign baseline with shared seeds and scope.
        Evaluator output supplies all numbers and decision codes. Agent
        commentary may summarize them. A completed run can have missing
        metrics or insufficient decision evidence. Execution or report
        generation failure instead leaves the run in error.
      responses:
        '200':
          description: Immutable evaluated report for this run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunReport'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The run is still queued or running, or it ended in error. Poll its status for details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                pending:
                  value: {code: report_pending, message: The run has no completed report yet.}
                failed:
                  value: {code: run_failed, message: This run ended before publishing a report.}
        '422': {$ref: '#/components/responses/InvalidRequest'}

  /api/v2/runs/{run_id}/historical-comparison:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getHistoricalComparison
      summary: Read historical evidence associated with a completed rehearsal
      description: |
        Join by run, approval and revision. Return the evidence snapshot pinned for this run.
        For older runs without a pinned reference, return unavailable, reason snapshot_missing.
        For a newly completed run, an unavailable source or prediction is an evidence outcome
        (HTTP 200). A failed run has no published report (409).
      responses:
        '200':
          description: Historical observation and, when supported, its held-out evaluation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoricalComparison'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Report pending or run failed, using the versioned error envelope.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/InvalidRequest'}

components:
  parameters:
    ReviewId:
      name: review_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}

  responses:
    StaleReview:
      description: A concurrent edit advanced the review. Rebase against current_review.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            stale:
              $ref: '#/components/examples/StaleReview'
    ApprovalReceipt:
      description: The exact revision was approved. The receipt identifies the frozen input versions.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Approval'}
          examples:
            illustrativeApproval:
              summary: Hypothetical approval after exact terms have been verified
              value:
                approval_id: '28667642-6a6f-4f80-8e53-d8427c10a946'
                review_id: '953c9aa4-57e6-49c7-bbaf-e64f0f0dd168'
                revision: 3
                approved_at: '2026-11-21T05:20:00Z'
                data_versions: {catalog: example-catalog-1, market: example-market-1, segments: example-segments-1, evaluation_policy: example-policy-1}
    RunAccepted:
      description: A run was accepted, or an identical submission has already been accepted.
      headers:
        Location:
          description: Relative URL of the run status.
          required: true
          schema: {type: string, format: uri-reference}
      links:
        pollRun:
          operationId: getRunStatus
          parameters:
            run_id: '$response.body#/run_id'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RunAccepted'}
          example:
            run_id: '942947fc-2b22-41bb-8ee2-2d8fbfd50edd'
            status_url: /api/v2/runs/942947fc-2b22-41bb-8ee2-2d8fbfd50edd
    NotFound:
      description: A referenced review, run, approval, or retry parent is unavailable in the caller's workspace.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: not_found, message: Resource not found.}
    InvalidRequest:
      description: Invalid JSON or request fields, including invalid confirmations.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            code: invalid_request
            message: A discount with a numeric value needs an explicit unit.
            issues:
              - {field: /fields/offer/unit, message: Supply the unit for this discount.}

  schemas:
    Change:
      properties:
        base_revision:
          type: integer
          minimum: 1.0
          title: Base Revision
        edits:
          anyOf:
          - $ref: '#/components/schemas/PlannerEdits'
          - type: 'null'
        confirm:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Confirm
        selling_period:
          anyOf:
          - $ref: '#/components/schemas/SellingPeriod'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - base_revision
      title: Change
    Choice:
      properties:
        id:
          type: string
          title: Id
        label:
          type: string
          title: Label
        value:
          $ref: '#/components/schemas/JsonValue'
        source:
          type: string
          enum:
          - catalog
          - supported_choice
          - extracted
          title: Source
      type: object
      required:
      - id
      - label
      - value
      - source
      title: Choice
    Choose:
      properties:
        base_revision:
          type: integer
          minimum: 1.0
          title: Base Revision
        choice:
          type: string
          minLength: 1
          title: Choice
          description: An id from next_step.choices for this revision.
      additionalProperties: false
      type: object
      required:
      - base_revision
      - choice
      title: Choose
    CostInput:
      properties:
        field:
          type: string
          title: Field
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
        unit:
          type: string
          title: Unit
        basis:
          type: string
          title: Basis
        origin:
          type: string
          title: Origin
        evidence_ref:
          type: string
          title: Evidence Ref
        source:
          type: string
          title: Source
        status:
          type: string
          title: Status
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      type: object
      required:
      - field
      - value
      - unit
      - basis
      - origin
      - evidence_ref
      - source
      - status
      - reason
      title: CostInput
    JsonValue: {}
    Links:
      properties:
        self:
          type: string
          title: Self
        turn:
          type: string
          title: Turn
        what_if:
          type: string
          title: What If
        approve:
          type: string
          title: Approve
        run:
          type: string
          title: Run
      type: object
      required:
      - self
      - turn
      - what_if
      - approve
      - run
      title: Links
    PolicyInput:
      properties:
        field:
          type: string
          title: Field
        value:
          $ref: '#/components/schemas/JsonValue'
        unit:
          type: string
          title: Unit
        basis:
          type: string
          title: Basis
        origin:
          type: string
          title: Origin
        evidence_ref:
          type: string
