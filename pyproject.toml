[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campaigntwin-backend"
version = "0.1.0"
description = "Fixture-backed campaign stress test API"
requires-python = ">=3.11"
dependencies = [
    "filelock>=3.13",
    "jsonschema[format-nongpl]>=4.22",
    "PyYAML>=6",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "openai>=1.50",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pytest>=8",
    "python-dotenv>=1.0",
    "ruff>=0.7",
    "scikit-learn>=1.5",
    "tzdata; sys_platform == 'win32'",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
data = ["pyreadr>=0.5.9", "openpyxl>=3.1"]

[tool.setuptools]
py-modules = ["main", "db"]
include-package-data = false

[tool.setuptools.packages.find]
include = ["agents*", "api*", "contracts*", "data*", "demo*", "docs", "engine*", "mocks*"]
namespaces = false

[tool.setuptools.package-data]
data = ["processed/*.csv", "processed/*.json", "processed/*.parquet"]
demo = ["*.json"]
docs = ["campaigntwin-api-v1.openapi.yaml"]
mocks = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
